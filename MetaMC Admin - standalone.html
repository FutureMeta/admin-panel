document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 --ease:cubic-bezier(.2,.8,.3,1); --dur-fast:120ms; --dur:180ms; --dur-chart:400ms;\n  --font-ui:'Inter',system-ui,sans-serif; --font-display:'Montserrat',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;\n}\n[data-theme=\"light\"]{\n  --s-base:#F4F6F7; --s-surface:#FFFFFF; --s-elevated:#FFFFFF; --s-overlay:#FFFFFF; --s-inset:#EDF1F3;\n  --bd-subtle:rgba(14,34,45,.10); --bd-strong:rgba(14,34,45,.20);\n  --tx-primary:#0E222D; --tx-secondary:#41606E; --tx-muted:#6C8593; --tx-disabled:#A3B4BD;\n  --ac:#C25E10; --ac-hover:#A94F09; --ac-pressed:#8C4207; --ac-soft:rgba(194,94,16,.10); --ac-text:#A94F09;\n  --blu:#1F6E95; --blu-viz:#1F6E95; --blu-soft:rgba(31,110,149,.10);\n  --ok:#15803D; --ok-soft:rgba(21,128,61,.10); --warn:#9A6700; --warn-soft:rgba(154,103,0,.10);\n  --err:#B91C1C; --err-soft:rgba(185,28,28,.10); --info:#1F6E95; --info-soft:rgba(31,110,149,.10);\n  --grid:rgba(14,34,45,.07);\n  --e1:0 1px 2px rgba(14,34,45,.08); --e2:0 4px 14px rgba(14,34,45,.10); --e3:0 18px 44px rgba(14,34,45,.16);\n}\n*{box-sizing:border-box}\nbody{margin:0;background:#071017;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:var(--ac-text);text-decoration:none}\na:hover{color:var(--ac-hover)}\n@keyframes mmShimmer{0%{background-position:-320px 0}100%{background-position:320px 0}}\n@keyframes mmRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{ rootRef }}\" data-theme=\"{{ theme }}\" style=\"background:var(--s-base);color:var(--tx-primary);font-family:var(--font-ui);min-height:100vh\">\n\n  <div style=\"position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(10,22,29,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd-subtle)\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding-right:16px;border-right:1px solid var(--bd-subtle)\">\n      <img src=\"2ac15681-3d99-41be-9066-b80a0d8c2e41\" alt=\"MetaMC\" style=\"width:26px;height:26px;object-fit:contain\">\n      <span style=\"font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase\">MetaMC<\u002Fspan>\n      <span style=\"font-size:11px;color:var(--tx-muted);letter-spacing:.08em;text-transform:uppercase\">Console<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;flex-wrap:wrap;flex:1\">\n      <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ s.go }}\" style=\"border:1px solid {{ s.bd }};background:{{ s.bg }};color:{{ s.fg }};font-family:var(--font-ui);font-size:12px;font-weight:500;padding:6px 11px;border-radius:var(--r-full);cursor:pointer;transition:all var(--dur) var(--ease)\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"border:1px solid var(--bd-subtle);background:var(--s-elevated);color:var(--tx-secondary);font-family:var(--font-ui);font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r-full);cursor:pointer\">Tema: {{ themeLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSistema }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:48px 32px 96px\">\n    <div style=\"margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-text)\">01 — Fondamenta<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px\">Design system<\u002Fh1>\n    <p style=\"max-width:620px;margin:0 0 48px;font-size:14px;line-height:22px;color:var(--tx-secondary)\">Token pronti all'uso come variabili CSS. Il tema chiaro deriva dagli stessi nomi: cambia il valore, non la gerarchia. L'arancio resta riservato ad azione primaria, stato attivo, serie dati principale e focus.<\u002Fp>\n\n    <h2 style=\"font-family:var(--font-display);font-size:18px;font-weight:600;margin:0 0 4px\">Superfici e bordi<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:13px;color:var(--tx-muted)\">Quattro livelli. La profondità viene dai bordi hairline, non dalle ombre.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:44px\">\n      <sc-for list=\"{{ surfaces }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);overflow:hidden;background:var(--s-surface)\">\n          <div style=\"height:64px;background:{{ c.val }};border-bottom:1px solid var(--bd-subtle)\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\">\n            <div style=\"font-size:13px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--tx-muted);margin-top:2px\">{{ c.token }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:var(--font-display);font-size:18px;font-weight:600;margin:0 0 4px\">Testo, accento, semantici<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:13px;color:var(--tx-muted)\">Ogni colore semantico ha la sua variante soft al 10–12% per i fondi di badge e banner.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:44px\">\n      <sc-for list=\"{{ roleColors }}\" as=\"c\" hint-placeholder-count=\"12\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:var(--s-surface)\">\n          <div style=\"width:26px;height:26px;border-radius:var(--r-xs);background:{{ c.val }};border:1px solid var(--bd-subtle);flex:none\"><\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--tx-muted)\">{{ c.token }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:var(--font-display);font-size:18px;font-weight:600;margin:0 0 4px\">Palette data-viz<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:13px;color:var(--tx-muted)\">Un colore per modalità, identico in tutta l'app. Le luminosità sono distanziate per restare leggibili in scala di grigi; ogni serie ha anche una forma di marker dedicata.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px\">\n      <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:14px\">\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <span style=\"width:12px;height:12px;border-radius:3px;background:{{ m.color }};flex:none\"><\u002Fspan>\n            <span style=\"font-size:14px;font-weight:600\">{{ m.name }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--tx-muted);margin-top:8px\">{{ m.color }}<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;margin-top:12px\">\n            <div style=\"height:6px;flex:1;border-radius:3px;background:{{ m.color }}\"><\u002Fdiv>\n            <div style=\"height:6px;flex:1;border-radius:3px;background:{{ m.gray }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;font-size:11px;color:var(--tx-muted)\">marker: {{ m.marker }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:44px\">\n      <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:14px\">\n        <div style=\"font-size:12px;font-weight:600;margin-bottom:10px\">Categorici estesi<\u002Fdiv>\n        <div style=\"display:flex;height:28px;border-radius:var(--r-xs);overflow:hidden\">\n          <sc-for list=\"{{ categorical }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div style=\"flex:1;background:{{ c }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:14px\">\n        <div style=\"font-size:12px;font-weight:600;margin-bottom:10px\">Sequenziale — heatmap, mappa<\u002Fdiv>\n        <div style=\"display:flex;height:28px;border-radius:var(--r-xs);overflow:hidden\">\n          <sc-for list=\"{{ ramp }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div style=\"flex:1;background:{{ c }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:14px\">\n        <div style=\"font-size:12px;font-weight:600;margin-bottom:10px\">Divergente — delta<\u002Fdiv>\n        <div style=\"display:flex;height:28px;border-radius:var(--r-xs);overflow:hidden\">\n          <sc-for list=\"{{ diverging }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div style=\"flex:1;background:{{ c }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:var(--font-display);font-size:18px;font-weight:600;margin:0 0 4px\">Tipografia<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:13px;color:var(--tx-muted)\">Montserrat per titoli, KPI e lockup. Inter per corpo, tabelle e UI densa. JetBrains Mono per ID, UUID, IP e comandi.<\u002Fp>\n    <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);overflow:hidden;margin-bottom:44px\">\n      <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:110px 1fr 230px;gap:16px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--bd-subtle)\">\n          <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--ac-text)\">{{ t.token }}<\u002Fdiv>\n          <div style=\"font-family:{{ t.family }};font-size:{{ t.size }};line-height:{{ t.lh }};font-weight:{{ t.weight }};letter-spacing:{{ t.ls }};color:var(--tx-primary)\">{{ t.sample }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--tx-muted);text-align:right\">{{ t.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:44px\">\n      <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:16px\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:14px\">Spacing — base 4px<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ spacing }}\" as=\"s\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--tx-muted);width:64px\">{{ s.token }}<\u002Fdiv>\n              <div style=\"height:10px;width:{{ s.val }};background:var(--ac-soft);border-left:2px solid var(--ac)\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--tx-muted)\">{{ s.val }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:16px\">\n        <div style=\"font-size:13px;font-weight:600;margin-bottom:14px\">Raggi ed elevazioni<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap\">\n          <sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"text-align:center\">\n              <div style=\"width:52px;height:44px;background:var(--s-elevated);border:1px solid var(--bd-strong);border-radius:{{ r.val }}\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--tx-muted);margin-top:6px\">{{ r.val }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px\">\n          <sc-for list=\"{{ elevations }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <div style=\"flex:1;text-align:center\">\n              <div style=\"height:44px;background:var(--s-elevated);border:1px solid var(--bd-subtle);border-radius:var(--r-md);box-shadow:{{ e.val }}\"><\u002Fdiv>\n              <div style=\"font-family:var(--font-mono);font-size:10px;color:var(--tx-muted);margin-top:6px\">{{ e.token }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;font-size:12px;color:var(--tx-secondary);line-height:20px\">Motion: <span style=\"font-family:var(--font-mono);color:var(--tx-primary)\">120–180ms<\u002Fspan> ease-out per hover e stati, <span style=\"font-family:var(--font-mono);color:var(--tx-primary)\">400ms<\u002Fspan> per l'ingresso dei grafici. Nessun rimbalzo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:var(--font-display);font-size:18px;font-weight:600;margin:0 0 4px\">Componenti<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:13px;color:var(--tx-muted)\">Inventario di base. Le taglie sono tre: 28, 32, 38px di altezza.<\u002Fp>\n    <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-surface);padding:20px;display:flex;flex-direction:column;gap:22px;margin-bottom:24px\">\n      <div>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-muted);margin-bottom:12px\">Bottoni<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n          <button style=\"height:32px;padding:0 14px;border:none;border-radius:var(--r-sm);background:var(--ac);color:#160A02;font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer\">Primario<\u002Fbutton>\n          <button style=\"height:32px;padding:0 14px;border:1px solid var(--bd-strong);border-radius:var(--r-sm);background:var(--s-elevated);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px;font-weight:500;cursor:pointer\">Secondario<\u002Fbutton>\n          <button style=\"height:32px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--tx-secondary);font-family:var(--font-ui);font-size:13px;font-weight:500;cursor:pointer\">Ghost<\u002Fbutton>\n          <button style=\"height:32px;padding:0 14px;border:1px solid rgba(219,52,52,.4);border-radius:var(--r-sm);background:var(--err-soft);color:var(--err);font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer\">Elimina<\u002Fbutton>\n          <button style=\"height:32px;padding:0 14px;border:none;border-radius:var(--r-sm);background:var(--ac);color:#160A02;font-family:var(--font-ui);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:progress\"><span style=\"width:12px;height:12px;border:2px solid rgba(22,10,2,.35);border-top-color:#160A02;border-radius:50%;display:inline-block\"><\u002Fspan>Salvataggio<\u002Fbutton>\n          <button disabled=\"{{ true }}\" style=\"height:32px;padding:0 14px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:var(--s-inset);color:var(--tx-disabled);font-family:var(--font-ui);font-size:13px;font-weight:500\">Disabilitato<\u002Fbutton>\n          <button style=\"height:32px;padding:0 14px;border:1px solid var(--bd-strong);border-radius:var(--r-sm);background:var(--s-elevated);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px;font-weight:500;box-shadow:0 0 0 2px var(--s-surface),0 0 0 4px var(--ac)\">Focus<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-muted);margin-bottom:12px\">Campi<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n          <input placeholder=\"Cerca giocatore\" style=\"height:32px;width:200px;padding:0 12px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:var(--s-inset);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px\">\n          <input value=\"dev@metamc.it\" sc-camel-read-only=\"{{ true }}\" style=\"height:32px;width:200px;padding:0 12px;border:1px solid var(--ac);border-radius:var(--r-sm);background:var(--s-inset);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px;box-shadow:0 0 0 3px var(--ac-soft)\">\n          <sc-raw-select style=\"height:32px;padding:0 10px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:var(--s-inset);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px\"><option>Ultimi 7 giorni<\u002Foption><\u002Fsc-raw-select>\n          <div style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:var(--s-inset);font-family:var(--font-mono);font-size:12px;color:var(--tx-secondary)\">01/08/2026 → 16/08/2026<\u002Fdiv>\n          <div style=\"width:38px;height:22px;border-radius:var(--r-full);background:var(--ac);position:relative\"><span style=\"position:absolute;top:3px;left:19px;width:16px;height:16px;border-radius:50%;background:#0E0603\"><\u002Fspan><\u002Fdiv>\n          <div style=\"width:16px;height:16px;border-radius:var(--r-xs);background:var(--ac);display:flex;align-items:center;justify-content:center;color:#160A02;font-size:11px;font-weight:700\">✓<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-muted);margin-bottom:12px\">Badge, pill, tab<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n          <sc-for list=\"{{ badges }}\" as=\"b\" hint-placeholder-count=\"5\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:var(--r-full);background:{{ b.soft }};color:{{ b.color }};font-size:11px;font-weight:600\"><span style=\"width:5px;height:5px;border-radius:50%;background:{{ b.color }}\"><\u002Fspan>{{ b.label }}<\u002Fspan>\n          <\u002Fsc-for>\n          <div style=\"display:flex;gap:2px;padding:3px;background:var(--s-inset);border-radius:var(--r-sm);border:1px solid var(--bd-subtle)\">\n            <span style=\"padding:5px 12px;border-radius:var(--r-xs);background:var(--s-overlay);color:var(--tx-primary);font-size:12px;font-weight:600\">Attivi<\u002Fspan>\n            <span style=\"padding:5px 12px;border-radius:var(--r-xs);color:var(--tx-muted);font-size:12px;font-weight:500\">Sospesi<\u002Fspan>\n            <span style=\"padding:5px 12px;border-radius:var(--r-xs);color:var(--tx-muted);font-size:12px;font-weight:500\">Inviti<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-muted);margin-bottom:12px\">Overlay<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n          <div style=\"padding:8px 10px;border-radius:var(--r-sm);background:var(--s-overlay);border:1px solid var(--bd-strong);box-shadow:var(--e2);font-size:12px;color:var(--tx-primary)\">Tooltip · <span style=\"font-family:var(--font-mono);font-variant-numeric:tabular-nums\">1.204 gioc.<\u002Fspan><\u002Fdiv>\n          <div style=\"width:190px;padding:6px;border-radius:var(--r-md);background:var(--s-overlay);border:1px solid var(--bd-strong);box-shadow:var(--e2);display:flex;flex-direction:column;gap:2px\">\n            <div style=\"padding:7px 9px;border-radius:var(--r-xs);background:var(--s-elevated);font-size:12.5px\">Esporta CSV<\u002Fdiv>\n            <div style=\"padding:7px 9px;border-radius:var(--r-xs);font-size:12.5px;color:var(--tx-secondary)\">Esporta PNG<\u002Fdiv>\n            <div style=\"padding:7px 9px;border-radius:var(--r-xs);font-size:12.5px;color:var(--tx-secondary)\">Apri in dettaglio<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:240px;padding:12px;border-radius:var(--r-md);background:var(--s-elevated);border:1px solid var(--bd-subtle);box-shadow:var(--e2);display:flex;gap:10px;align-items:flex-start\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:6px;flex:none\"><\u002Fspan>\n            <div><div style=\"font-size:12.5px;font-weight:600\">Ruolo aggiornato<\u002Fdiv><div style=\"font-size:11.5px;color:var(--tx-muted);margin-top:2px\">Le modifiche sono attive.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:190px;height:72px;border-radius:var(--r-md);border:1px solid var(--bd-subtle);background:linear-gradient(90deg,var(--s-elevated) 0%,var(--s-overlay) 50%,var(--s-elevated) 100%);background-size:320px 100%;animation:mmShimmer 1.4s linear infinite\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:var(--font-display);font-size:18px;font-weight:600;margin:44px 0 4px\">Stati di sistema<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:13px;color:var(--tx-muted)\">I quattro casi che l'utente incontra davvero. Il feed realtime non blocca mai la pagina.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;gap:10px;padding:12px 14px;border:1px solid rgba(224,163,46,.35);background:var(--warn-soft);border-radius:var(--r-md);align-items:center\">\n              <span style=\"width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none\"><\u002Fspan>\n              <div style=\"font-size:12.5px;color:var(--tx-secondary)\">Connessione al feed realtime persa. I dati mostrati risalgono alle <span style=\"font-family:var(--font-mono)\">22:58<\u002Fspan> — <span style=\"color:var(--tx-primary)\">nuovo tentativo tra 8s<\u002Fspan>.<\u002Fdiv>\n              <button style=\"margin-left:auto;height:28px;padding:0 11px;border:1px solid var(--bd-strong);border-radius:var(--r-sm);background:var(--s-elevated);color:var(--tx-primary);font-family:var(--font-ui);font-size:12px;font-weight:500;cursor:pointer\">Riprova ora<\u002Fbutton>\n              <button style=\"width:28px;height:28px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:transparent;color:var(--tx-muted);cursor:pointer;font-size:13px;line-height:1\">×<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n              <section style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-lg);background:var(--s-surface);padding:44px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:260px\">\n                <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--ac-text)\">403<\u002Fspan>\n                <h3 style=\"font-family:var(--font-display);font-size:19px;font-weight:700;margin:0\">Non hai accesso a questo modulo<\u002Fh3>\n                <p style=\"margin:0;font-size:13px;line-height:21px;color:var(--tx-secondary);max-width:380px\">Il modulo <strong style=\"color:var(--tx-primary)\">Utenti &amp; Ruoli<\u002Fstrong> richiede almeno il livello di lettura. Chiedi a un owner di aggiornare il tuo ruolo: la richiesta finisce nel registro attività.<\u002Fp>\n                <div style=\"display:flex;gap:8px;margin-top:6px\">\n                  <button style=\"height:34px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-sm);background:var(--ac);color:#150A02;font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer\">Richiedi accesso<\u002Fbutton>\n                  <button style=\"height:34px;padding:0 14px;border:1px solid var(--bd-strong);border-radius:var(--r-sm);background:var(--s-elevated);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px;cursor:pointer\">Torna alla panoramica<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-lg);background:var(--s-surface);padding:44px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:260px\">\n                <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--tx-muted)\">404<\u002Fspan>\n                <h3 style=\"font-family:var(--font-display);font-size:19px;font-weight:700;margin:0\">Pagina non trovata<\u002Fh3>\n                <p style=\"margin:0;font-size:13px;line-height:21px;color:var(--tx-secondary);max-width:380px\">L'indirizzo <span style=\"font-family:var(--font-mono);font-size:12px\">/moduli/economia<\u002Fspan> non esiste o è stato spostato. Se cercavi un modulo nuovo, potrebbe non essere ancora attivo sul tuo account.<\u002Fp>\n                <div style=\"display:flex;gap:8px;margin-top:6px\">\n                  <button style=\"height:34px;padding:0 14px;border:1px solid var(--bd-strong);border-radius:var(--r-sm);background:var(--s-elevated);color:var(--tx-primary);font-family:var(--font-ui);font-size:13px;cursor:pointer\">Torna indietro<\u002Fbutton>\n                  <button style=\"height:34px;padding:0 14px;border:1px solid var(--bd-subtle);border-radius:var(--r-sm);background:transparent;color:var(--tx-secondary);font-family:var(--font-ui);font-size:13px;cursor:pointer\">Apri ⌘K<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-lg);background:var(--s-surface);padding:24px;display:flex;flex-direction:column;gap:14px\">\n                <div style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-muted)\">Widget in errore<\u002Fdiv>\n                <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-base);padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\">\n                  <span style=\"width:32px;height:32px;border-radius:var(--r-full);background:var(--err-soft);color:var(--err);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700\">!<\u002Fspan>\n                  <div style=\"font-size:13px;font-weight:600\">Serie parziale<\u002Fdiv>\n                  <div style=\"font-size:12px;line-height:19px;color:var(--tx-muted);max-width:300px\">Tra le 03:10 e le 04:40 la raccolta si è fermata. Il buco è mostrato tratteggiato, non interpolato.<\u002Fdiv>\n                  <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--tx-disabled)\">gap_collector · 90 min<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-lg);background:var(--s-surface);padding:24px;display:flex;flex-direction:column;gap:14px\">\n                <div style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-muted)\">Manutenzione<\u002Fdiv>\n                <div style=\"border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--s-base);padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center\">\n                  <img src=\"2ac15681-3d99-41be-9066-b80a0d8c2e41\" alt=\"MetaMC\" style=\"width:34px;height:34px;object-fit:contain;opacity:.8\">\n                  <div style=\"font-family:var(--font-display);font-size:15px;font-weight:600\">Console in manutenzione<\u002Fdiv>\n                  <div style=\"font-size:12.5px;line-height:20px;color:var(--tx-secondary);max-width:340px\">Aggiornamento della pipeline statistiche. Rientro previsto alle <span style=\"font-family:var(--font-mono)\">02:30<\u002Fspan> del 17/08/2026. I server di gioco non sono interessati.<\u002Fdiv>\n                  <span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:var(--r-full);background:var(--warn-soft);color:var(--warn);font-size:11.5px\"><span style=\"width:5px;height:5px;border-radius:50%;background:var(--warn)\"><\u002Fspan>Network di gioco online<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"padding:36px 32px 90px\">\n    <div style=\"max-width:1440px;margin:0 auto 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n      <div>\n        <div style=\"margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-text)\">02 — Accesso<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-display);font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em;margin:0\">Login su invito<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px\">\n        <sc-for list=\"{{ loginStates }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ s.go }}\" style=\"border:1px solid {{ s.bd }};background:{{ s.bg }};color:{{ s.fg  9 9 0 0 0 0 18zM3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z',\n  shield:'M12 21s7-3.2 7-9V5.6L12 3 5 5.6V12c0 5.8 7 9 7 9z',\n  panel:'M4 4h16v16H4zM9.5 4v16'\n};\nconst NAV = [\n  { area:'Analisi', items:[\n    { label:'Panoramica network', icon:I.grid, screen:'panoramica' },\n    { label:'Dettaglio modalità', icon:I.modes, screen:'towny' }\n  ]},\n  { area:'Amministrazione', items:[\n    { label:'Utenti & Ruoli', icon:I.users, screen:'utenti' },\n    { label:'Registro attività', icon:I.log, screen:'registro' }\n  ]}\n];\nconst BREAD = {\n  shell:'App shell', panoramica:'Panoramica network', towny:'Dettaglio modalità · Towny',\n  utenti:'Utenti & Ruoli', registro:'Registro attività'\n};\nconst RAMP = ['#0F212A','#16394B','#1E5670','#4C6E72','#8A7147','#C08129','#F0A63F'];\nconst fmt = n => Number(n).toLocaleString('it-IT');\nconst hx = v => Math.round(v * 100) / 100;\n\nfunction lerpHex(a, b, t) {\n  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];\n  const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b);\n  const c = v => Math.round(v).toString(16).padStart(2,'0');\n  return '#' + c(r1+(r2-r1)*t) + c(g1+(g2-g1)*t) + c(b1+(b2-b1)*t);\n}\nfunction rampColor(t) {\n  const x = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);\n  const i = Math.min(RAMP.length - 2, Math.floor(x));\n  return lerpHex(RAMP[i], RAMP[i+1], x - i);\n}\nfunction linePath(pts) {\n  let d = '', pen = false;\n  pts.forEach(p => {\n    if (!p) { pen = false; return; }\n    d += (pen ? ' L' : ' M') + hx(p[0]) + ' ' + hx(p[1]);\n    pen = true;\n  });\n  return d.trim();\n}\nfunction areaPath(pts, y0) {\n  let d = '', run = [];\n  const flush = () => {\n    if (run.length < 2) { run = []; return; }\n    d += ' M' + hx(run[0][0]) + ' ' + y0;\n    run.forEach(p => { d += ' L' + hx(p[0]) + ' ' + hx(p[1]); });\n    d += ' L' + hx(run[run.length-1][0]) + ' ' + y0 + ' Z';\n    run = [];\n  };\n  pts.forEach(p => { if (!p) flush(); else run.push(p); });
