# CI. §12, §16.10
#
# Matrice su Node 24 e 26 DAL PRIMO COMMIT: la 24 entra in Maintenance il
# 2026-10-20, nove settimane dopo l'inizio di questo lavoro. Scoprire un
# incompatibilita' con la 26 il giorno della migrazione e' il modo piu' caro
# di scoprirla.
#
# Le action sono pinnate per commit SHA, non per tag: un tag e' mutabile, e
# una action compromessa che riscrive il proprio tag entra in CI senza che il
# lockfile se ne accorga.

name: CI

on:
  push:
    branches: [main, fase-1]
  pull_request:

# Permessi minimi per job: il default del repository puo' essere piu' largo.
permissions:
  contents: read

env:
  PNPM_VERSION: 11.22.0

jobs:
  check:
    name: Controlli statici
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # §7 — la guardia che fallisce la build se un confronto su ruoli compare
      # fuori da src/authz/, se ricompare innerHTML (SEC-35) o se qualcuno
      # accetta un parametro di redirect dal client (SEC-20).
      - name: Guardie di sicurezza
        run: pnpm run lint:guards

      - name: Identificatori in inglese
        run: pnpm run lint:identifiers

      - name: Type check
        run: pnpm run typecheck

      - name: Lint e formattazione
        run: pnpm run lint

      # §12 — nessun pacchetto @better-auth/* fuori dalla allowlist. La
      # superficie di quello scope e' la meta' del rischio di supply chain di
      # questo progetto: 1 maintainer npm, 211 release/anno, 13 advisory nel
      # solo 2026.
      - name: Allowlist @better-auth/*
        run: |
          set -euo pipefail
          found=$(node -e "
            const p = require('./package.json');
            const all = { ...p.dependencies, ...p.devDependencies };
            const allowed = new Set(['better-auth', '@better-auth/redis-storage']);
            const bad = Object.keys(all).filter(k => k.startsWith('@better-auth/') && !allowed.has(k));
            console.log(bad.join(' '));
          ")
          if [ -n "$found" ]; then
            echo \"pacchetti @better-auth/* fuori allowlist: $found\"
            exit 1
          fi

      # Versioni esatte: un range in package.json rende il lockfile una
      # fotografia di ieri invece che un vincolo.
      - name: Versioni pinnate esatte
        run: |
          set -euo pipefail
          if node -e "
            const p = require('./package.json');
            const all = { ...p.dependencies, ...p.devDependencies };
            const loose = Object.entries(all).filter(([, v]) => /^[\^~>=<]/.test(v));
            if (loose.length) { console.log(loose.map(([k, v]) => k + '@' + v).join(' ')); process.exit(1); }
          "; then :; else
            echo 'trovate versioni non pinnate'
            exit 1
          fi

  audit:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      # La provenance npm firmata NON basta: nella campagna ChainDrop le
      # versioni avvelenate avevano provenance valida, perche' era la pipeline
      # stessa a essere compromessa.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@75ab1b8ded03f6f2a2ee1d1e0d1eb1e0e5b8c95d # v1.9.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26']

    services:
      # §14 — PostgreSQL EFFIMERO con le migration reali. Non pglite: servono
      # ruoli, GRANT/REVOKE, partizionamento e trigger, e pglite non li ha.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['55432:5432']

      # Redis vero: qui `TEST_REDIS_URL` e' impostata, quindi mini-redis non
      # viene nemmeno caricato e il rate limiter gira sul suo backend Redis con
      # lo script Lua, cioe' esattamente come in produzione.
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['6379:6379']

    env:
      TEST_PG_ADMIN_URL: postgres://postgres:ci@127.0.0.1:55432/postgres
      TEST_PG_ROLE_PASSWORD: ${{ github.run_id }}-ci
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test di accettazione (§14)
        run: pnpm test

      - name: Build del frontend
        run: pnpm run build:web

      # Il segnaposto del nonce deve sopravvivere al build: senza, la CSP con
      # nonce non ha effetto e la pagina resta bianca (§5.1).
      # Sul TAG, non sulla presenza della stringa: Vite riscrive i tag che
      # emette, e cercare solo il segnaposto passerebbe anche se fosse rimasto
      # in un commento — con strict-dynamic la pagina resterebbe bianca.
      - name: Il nonce CSP e' sul tag script del build
        run: grep -qE '<script[^>]*nonce="__CSP_NONCE__"' dist/index.html
