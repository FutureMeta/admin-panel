# §2 — nginx davanti al processo Node.
#
# Le regole qui non sono ottimizzazioni: tre di esse sono contromisure, e se
# saltano il codice applicativo non se ne accorge.

upstream metamc_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Redirect a TLS. Nessun contenuto servito in chiaro: i cookie sono `__Host-`
# e `Secure`, quindi su http non partirebbero comunque — ma un utente che
# arriva su http deve finire su https, non su una pagina che non funziona.
server {
    listen 80;
    listen [::]:80;
    server_name admin.metamc.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.metamc.it;

    ssl_certificate     /etc/letsencrypt/live/admin.metamc.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.metamc.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. L'header lo mette anche helmet: qui c'è perché una risposta di
    # nginx che non arriva mai all'applicazione (un 413, un 502) deve averlo
    # lo stesso.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    server_tokens off;

    # -----------------------------------------------------------------------
    # SEC-22 — X-Forwarded-For va SOVRASCRITTO, non appeso.
    #
    # Con `proxy_add_x_forwarded_for` il valore inviato dal client resta in
    # testa alla lista, e qualunque logica che legge il primo elemento
    # crederebbe all'attaccante. Il rate limit per IP e i due IP dell'audit
    # dipendono da questa riga.
    # -----------------------------------------------------------------------
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # -----------------------------------------------------------------------
    # §2 — rifiuto a monte degli URL non canonici.
    #
    # Non si serve nulla da disco qui, ma la difesa non deve dipendere dal
    # fatto che a valle non ci sia @fastify/static: le tre advisory 2026 su
    # quel pacchetto sono tutte bypass di guardie via path non canonici.
    # -----------------------------------------------------------------------
    if ($request_uri ~* "(\.\.|%2e%2e|%2f|%5c|\\\\)") {
        return 400;
    }

    client_max_body_size 1m;

    # -----------------------------------------------------------------------
    # Asset con hash nel nome: immutabili per un anno.
    #
    # `immutable` è sicuro SOLO perché il nome contiene l'hash del contenuto:
    # un file diverso ha un nome diverso, quindi non esiste il caso "cache
    # vecchia di un file cambiato".
    # -----------------------------------------------------------------------
    location /assets/ {
        alias /srv/metamc-admin/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # I font (Inter, Montserrat, JetBrains Mono) sono ospitati da noi: la CSP
    # ha `font-src 'self'`, e un pannello di staff non deve annunciare a
    # Google chi lo sta usando. Il nome NON contiene un hash — cambia solo se
    # cambia il prototipo — quindi niente `immutable`: una settimana e basta.
    location /fonts/ {
        alias /srv/metamc-admin/dist/fonts/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # SEC-29 — 64 KB sulle rotte di autenticazione. Il limite vero lo applica
    # Fastify (4 KB), questo taglia il traffico prima che tocchi Node.
    # -----------------------------------------------------------------------
    location /api/auth/ {
        client_max_body_size 64k;
        proxy_pass http://metamc_app;
    }

    # -----------------------------------------------------------------------
    # SEC-19 — webhook Resend: il body deve arrivare INTATTO.
    #
    # Nessuna trasformazione, nessun buffering che riscriva i byte: la firma
    # Svix si verifica sul raw, e un byte diverso la invalida.
    # -----------------------------------------------------------------------
    location /webhooks/resend {
        client_max_body_size 64k;
        proxy_request_buffering on;
        proxy_pass http://metamc_app;
    }

    # -----------------------------------------------------------------------
    # §16.9 — predisposizione per la rotta SSE di fase 2.
    #
    # Costa due righe oggi. Senza, il primo stream di fase 2 resterebbe muto
    # per cinque minuti e poi cadrebbe, e la diagnosi sarebbe lunga.
    # -----------------------------------------------------------------------
    location /api/stream {
        proxy_pass http://metamc_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering "no" always;
    }

    # Sonde: non finiscono nei log di accesso, altrimenti li riempiono da sole.
    location /health/ {
        proxy_pass http://metamc_app;
        access_log off;
    }

    # Metriche e verifica di integrità: solo dalla rete di gestione.
    location /internal/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://metamc_app;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Tutto il resto: index.html generato da Node con il nonce CSP.
    #
    # `no-store` è obbligatorio: la pagina contiene un nonce valido per una
    # sola richiesta, e una copia in cache lo renderebbe riutilizzabile.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://metamc_app;
        add_header Cache-Control "no-store" always;
    }
}
